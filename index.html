<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loona AI</title>
<style>
:root{--bg:#0f1117;--side:#14161f;--panel:#1a1d29;--line:#262a3a;--text:#e8eaf2;--muted:#8b90a5;--accent:#5b4df5;--green:#22c55e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;overflow:hidden}
aside{width:260px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px;gap:12px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--accent);display:grid;place-items:center;font-size:18px}
.badge{display:inline-block;font-size:10px;letter-spacing:.08em;background:#2a2d45;color:#a9a3ff;padding:2px 8px;border-radius:5px;margin-top:2px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 14px;font-size:14px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
nav{display:flex;flex-direction:column;gap:4px}
nav button{display:flex;align-items:center;gap:12px;background:none;border:0;color:var(--text);padding:12px;border-radius:10px;font-size:14px;cursor:pointer;text-align:left}
nav button:hover{background:#1d2030}
nav button.active{background:#232637}
.recent{flex:1;overflow-y:auto;min-height:0}
.recent h4{font-size:11px;letter-spacing:.1em;color:var(--muted);margin:8px 4px}
.recent div{padding:8px 10px;border-radius:8px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent div:hover{background:#1d2030;color:var(--text)}
.user{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:12px;font-size:13px}
.user small{color:var(--green);display:block}
main{flex:1;display:flex;flex-direction:column;min-width:0}
.view{display:none;flex:1;flex-direction:column;min-height:0}
.view.show{display:flex}
header{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
header h2{font-size:17px}
.scroll{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:760px;padding:12px 16px;border-radius:14px;line-height:1.55;font-size:14.5px;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--accent)}
.msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.msg.err{border-color:#7f1d1d;color:#fca5a5}
.bar{display:flex;gap:10px;padding:16px 24px;border-top:1px solid var(--line)}
input,textarea{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:12px 14px;border-radius:10px;font:inherit;font-size:14px;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:90px}
.pad{padding:24px;display:flex;flex-direction:column;gap:14px;flex:1;min-height:0;overflow-y:auto}
iframe{width:100%;flex:1;min-height:360px;border:1px solid var(--line);border-radius:12px;background:#fff}
.imgbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:300px;display:grid;place-items:center;color:var(--muted);overflow:hidden}
.imgbox img{max-width:100%;max-height:60vh;display:block}
pre{background:#0b0d14;border:1px solid var(--line);border-radius:12px;padding:16px;overflow:auto;font-size:13px;line-height:1.5;flex:1;white-space:pre-wrap}
.row{display:flex;gap:10px;flex-wrap:wrap}
@media(max-width:760px){aside{width:72px;padding:10px}.brand span,.badge,nav button span,.recent,.user div,.btn.new span{display:none}nav button{justify-content:center}}
</style>
</head>
<body>

<aside>
  <div class="brand"><div class="logo">✳</div><div>Loona<br><span class="badge">ENTERPRISE</span></div></div>
  <button class="btn new" id="newChat">+ <span>New Workspace / Chat</span></button>
  <nav id="nav">
    <button data-view="chat" class="active">💬 <span>AI Assistant</span></button>
    <button data-view="web">🖥️ <span>Website Builder</span></button>
    <button data-view="image">🎨 <span>Image Studio</span></button>
    <button data-view="code">&lt;/&gt; <span>Code &amp; Scripts</span></button>
  </nav>
  <div class="recent"><h4>RECENT SESSIONS</h4><div id="recentList"></div></div>
  <div class="user">👤 <div><b>Loona Admin</b><small>● Enterprise Active</small></div></div>
</aside>

<main>
  <!-- CHAT -->
  <section class="view show" id="view-chat">
    <header><h2>AI Assistant</h2>
      <div class="row"><button class="btn ghost" id="voiceBtn">🎤 Voice</button><button class="btn ghost" id="clearBtn">Clear all</button></div></header>
    <div class="scroll" id="chatBox"></div>
    <div class="bar"><input id="chatInput" placeholder="Kuch bhi poochhein..." autocomplete="off"><button class="btn" id="sendBtn">Send</button></div>
  </section>

  <!-- WEBSITE BUILDER -->
  <section class="view" id="view-web">
    <header><h2>Website Builder</h2>
      <div class="row"><button class="btn" id="genWebBtn">Generate</button><button class="btn ghost" id="dlWebBtn">Download index.html</button></div></header>
    <div class="pad">
      <textarea id="webPrompt" placeholder="Website ke baare mein likhein, e.g. Faisalabad ke textile business ki landing page"></textarea>
      <iframe id="webFrame" sandbox="allow-scripts"></iframe>
    </div>
  </section>

  <!-- IMAGE -->
  <section class="view" id="view-image">
    <header><h2>Image Studio</h2></header>
    <div class="pad">
      <div class="row"><input id="imgPrompt" placeholder="Image ka description likhein (English behtar chalta hai)"><button class="btn" id="genImgBtn">Generate</button></div>
      <div class="imgbox" id="imgBox">Yahan image aayegi</div>
    </div>
  </section>

  <!-- CODE -->
  <section class="view" id="view-code">
    <header><h2>Code &amp; Scripts</h2><button class="btn" id="genCodeBtn">Generate</button></header>
    <div class="pad">
      <textarea id="codePrompt" placeholder="Kis cheez ka code chahiye? e.g. Flask webhook jo POST receive kare"></textarea>
      <pre id="codeOut">Code yahan dikhega...</pre>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";

  var KEY = "loona_chat_v1";
  var SYSTEM = "You are Loona AI, a helpful assistant. Reply in the same language the user writes in (Urdu, Roman Urdu or English).";
  var history = [];
  var lastHTML = "";

  function $(id) { return document.getElementById(id); }

  /* ---------- Navigation ---------- */
  var navButtons = document.querySelectorAll("#nav button");
  navButtons.forEach(function (b) {
    b.addEventListener("click", function () {
      navButtons.forEach(function (x) { x.classList.remove("active"); });
      b.classList.add("active");
      document.querySelectorAll(".view").forEach(function (v) { v.classList.remove("show"); });
      $("view-" + b.getAttribute("data-view")).classList.add("show");
    });
  });

  /* ---------- AI call (Pollinations, no key needed) ---------- */
  function askAI(messages) {
    return fetch("https://text.pollinations.ai/openai", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: "openai", messages: messages })
    }).then(function (r) {
      if (!r.ok) { throw new Error("Server error " + r.status); }
      return r.json();
    }).then(function (d) {
      return d.choices[0].message.content;
    });
  }

  /* ---------- Chat ---------- */
  function addMsg(role, text, isErr) {
    var d = document.createElement("div");
    d.className = "msg " + (role === "user" ? "user" : "bot") + (isErr ? " err" : "");
    d.textContent = text; // textContent: HTML kabhi execute nahi hoga
    $("chatBox").appendChild(d);
    $("chatBox").scrollTop = $("chatBox").scrollHeight;
    return d;
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(history)); } catch (e) {}
    renderRecent();
  }

  function renderRecent() {
    var list = $("recentList");
    list.textContent = "";
    history.filter(function (m) { return m.role === "user"; }).slice(-8).reverse().forEach(function (m) {
      var d = document.createElement("div");
      d.textContent = m.content;
      list.appendChild(d);
    });
  }

  function load() {
    try { history = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { history = []; }
    $("chatBox").textContent = "";
    if (!history.length) {
      addMsg("bot", "Assalam o Alaikum! Main Loona AI hoon. Aap kya poochhna chahte hain?");
    }
    history.forEach(function (m) { addMsg(m.role, m.content); });
    renderRecent();
  }

  function send() {
    var text = $("chatInput").value.trim();
    if (!text) { return; }
    $("chatInput").value = "";
    addMsg("user", text);
    history.push({ role: "user", content: text });
    var wait = addMsg("bot", "Soch raha hoon...");
    var msgs = [{ role: "system", content: SYSTEM }].concat(history.slice(-12));
    askAI(msgs).then(function (reply) {
      wait.textContent = reply;
      history.push({ role: "assistant", content: reply });
      save();
    }).catch(function (e) {
      wait.textContent = "Error: " + e.message + ". Internet check karein aur dobara try karein.";
      wait.classList.add("err");
    });
  }

  $("sendBtn").addEventListener("click", send);
  $("chatInput").addEventListener("keydown", function (e) { if (e.key === "Enter") { send(); } });

  function newChat() { history = []; save(); load(); }
  $("newChat").addEventListener("click", newChat);
  $("clearBtn").addEventListener("click", function () {
    if (confirm("Saari chat history delete karni hai?")) {
      try { localStorage.removeItem(KEY); } catch (e) {}
      newChat();
    }
  });

  /* ---------- Voice input ---------- */
  $("voiceBtn").addEventListener("click", function () {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert("Is browser mein voice input support nahi hai. Chrome use karein."); return; }
    var rec = new SR();
    rec.lang = "ur-PK";
    rec.onresult = function (e) { $("chatInput").value = e.results[0][0].transcript; };
    rec.onerror = function () { alert("Mic access allow karein."); };
    rec.start();
  });

  /* ---------- Website builder ---------- */
  function cleanHTML(t) {
    t = t.replace(/^```[a-z]*\s*/i, "").replace(/```\s*$/, "").trim();
    var i = t.toLowerCase().indexOf("<!doctype");
    return i > 0 ? t.slice(i) : t;
  }

  function generateWebsite() {
    var p = $("webPrompt").value.trim();
    if (!p) { alert("Pehle prompt likhein."); return; }
    $("genWebBtn").disabled = true;
    $("genWebBtn").textContent = "Ban rahi hai...";
    askAI([
      { role: "system", content: "You output ONLY one complete, modern, responsive HTML file with inline CSS and JS. No explanations, no markdown fences." },
      { role: "user", content: "Build a professional website: " + p }
    ]).then(function (html) {
      lastHTML = cleanHTML(html);
      $("webFrame").srcdoc = lastHTML; // iframe mein alag chalta hai, main page ko nahi todta
    }).catch(function (e) {
      alert("Error: " + e.message);
    }).then(function () {
      $("genWebBtn").disabled = false;
      $("genWebBtn").textContent = "Generate";
    });
  }
  $("genWebBtn").addEventListener("click", generateWebsite);

  $("dlWebBtn").addEventListener("click", function () {
    if (!lastHTML) { alert("Pehle website generate karein."); return; }
    var blob = new Blob([lastHTML], { type: "text/html" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "index.html";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });

  /* ---------- Image studio ---------- */
  $("genImgBtn").addEventListener("click", function () {
    var p = $("imgPrompt").value.trim() || "luxury tech branding";
    var box = $("imgBox");
    box.textContent = "Image ban rahi hai...";
    var img = new Image();
    img.onload = function () { box.textContent = ""; box.appendChild(img); };
    img.onerror = function () { box.textContent = "Image load nahi hui, dobara try karein."; };
    img.alt = p;
    img.src = "https://image.pollinations.ai/prompt/" + encodeURIComponent(p) + "?nologo=true&seed=" + Date.now();
  });
  $("imgPrompt").addEventListener("keydown", function (e) { if (e.key === "Enter") { $("genImgBtn").click(); } });

  /* ---------- Code & scripts ---------- */
  $("genCodeBtn").addEventListener("click", function () {
    var p = $("codePrompt").value.trim();
    if (!p) { alert("Pehle prompt likhein."); return; }
    $("codeOut").textContent = "Code ban raha hai...";
    askAI([
      { role: "system", content: "You are a senior developer. Output working code with short comments." },
      { role: "user", content: p }
    ]).then(function (r) { $("codeOut").textContent = r; })
      .catch(function (e) { $("codeOut").textContent = "Error: " + e.message; });
  });

  load();
})();
</script>
</body>
</html>
