<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loona AI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #ffffff; color: #1f1f1f; height: 100vh; display: flex; overflow: hidden; }
  button { cursor: pointer; font-family: inherit; border: none; background: transparent; }

  /* ============ SIDEBAR ============ */
  #sidebar {
    width: 260px; background: #f0f4f9;
    display: flex; flex-direction: column; justify-content: space-between;
    flex-shrink: 0; height: 100vh;
  }
  #sidebar .top { padding: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 8px 6px; }
  .brand-icon { width: 24px; height: 24px; }
  .brand-name { font-weight: 600; font-size: 16px; }

  .new-chat-btn {
    display: flex; align-items: center; gap: 10px;
    background: #e8f0fe; color: #1967d2;
    padding: 10px 20px 10px 16px; border-radius: 999px;
    font-size: 14px; margin: 12px 6px; font-weight: 500;
  }
  .new-chat-btn:hover { background: #d2e3fc; }

  .nav-btn {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; border-radius: 999px;
    font-size: 13px; color: #1f1f1f; width: 100%; text-align: left;
  }
  .nav-btn:hover { background: #e4e8ed; }
  .nav-btn i { width: 16px; color: #5f6368; }

  .user-profile {
    padding: 12px; border-top: 1px solid #dadce0;
    display: flex; align-items: center; justify-content: space-between;
  }
  .user-info { display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(135deg, #2563eb, #4f46e5);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 13px;
  }
  .user-name { font-size: 13px; font-weight: 600; }
  .user-role { font-size: 11px; color: #5f6368; }

  /* ============ MAIN ============ */
  main { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; }

  .top-bar {
    height: 56px; display: flex; align-items: center; justify-content: flex-end;
    padding: 0 24px; flex-shrink: 0;
  }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #5f6368; font-size: 15px;
  }
  .icon-btn:hover { background: #f1f3f4; }

  /* Chat area */
  .chat-area {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 0 16px; overflow: hidden; position: relative;
  }
  .chat-scroll {
    width: 100%; max-width: 760px; max-height: 55vh;
    overflow-y: auto; display: flex; flex-direction: column;
    gap: 20px; padding: 0 8px;
  }
  .welcome { text-align: center; padding: 20px; }
  .welcome h1 { font-size: 42px; font-weight: 400; }

  .msg-user {
    align-self: flex-end; background: #e8f0fe;
    padding: 12px 18px; border-radius: 20px;
    max-width: 500px; font-size: 15px; word-wrap: break-word;
  }
  .msg-bot { padding: 6px 0; font-size: 15px; line-height: 1.6; white-space: pre-wrap; }

  /* Input bar */
  .input-wrapper {
    width: 100%; max-width: 760px; margin: 20px auto 30px;
    padding: 0 8px; position: relative;
  }
  .input-bar {
    background: #f0f4f9; border-radius: 28px;
    padding: 12px 18px; display: flex; align-items: center; gap: 10px;
  }
  .input-bar .plus {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #5f6368; font-size: 18px; flex-shrink: 0;
  }
  .input-bar .plus:hover { background: #e4e8ed; }
  .input-bar input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 15px; color: #1f1f1f; font-family: inherit;
  }
  .input-bar .model-btn {
    display: flex; align-items: center; gap: 4px;
    font-size: 13px; color: #5f6368; padding: 4px 8px; border-radius: 999px;
  }
  .input-bar .model-btn:hover { background: #e4e8ed; }
  .input-bar .mic, .input-bar .send {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #5f6368; font-size: 15px;
  }
  .input-bar .mic:hover { background: #e4e8ed; }
  .input-bar .send { background: #1a73e8; color: #fff; }
  .input-bar .send:hover { background: #1557b0; }

  /* ============ PLUS MENU ============ */
  .plus-menu {
    display: none; position: absolute;
    bottom: 76px; left: 8px;
    background: #fff; border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,.15), 0 2px 6px rgba(0,0,0,.06);
    width: 300px; padding: 10px; z-index: 500;
  }
  .plus-menu.show { display: block; }

  .menu-item {
    display: flex; align-items: center; gap: 14px;
    padding: 11px 14px; border-radius: 12px;
    font-size: 14px; color: #1f1f1f; width: 100%; text-align: left;
    transition: background .12s;
  }
  .menu-item:hover { background: #f1f3f4; }
  .menu-item .m-icon { font-size: 17px; width: 22px; text-align: center; flex-shrink: 0; }
  .menu-divider { border: none; border-top: 1px solid #e8eaed; margin: 6px 4px; }

  /* Submenu */
  .has-sub { position: relative; }
  .sub-menu {
    display: none; position: absolute;
    left: calc(100% + 6px); top: -8px;
    background: #fff; border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.15);
    width: 250px; padding: 10px; z-index: 600;
  }
  .has-sub:hover .sub-menu { display: block; }
  .sub-menu .menu-item { font-size: 13.5px; }

  /* Toggle */
  .lab-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; border-radius: 12px;
    font-size: 13.5px; cursor: pointer;
  }
  .lab-row:hover { background: #f1f3f4; }
  .switch { position: relative; display: inline-block; width: 34px; height: 20px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #dadce0; border-radius: 20px; transition: .2s; }
  .slider::before { content: ""; position: absolute; height: 14px; width: 14px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + .slider { background: #1a73e8; }
  .switch input:checked + .slider::before { transform: translateX(14px); }

  /* Icons */
  .ic-blue { color: #1a73e8; }
  .ic-green { color: #34a853; }
  .ic-gray { color: #5f6368; }
  .ic-red { color: #ea4335; }
  .ic-yellow { color: #fbbc04; }
  .ic-purple { color: #a142f4; }
  .ic-cyan { color: #00acc1; }

  /* Canvas (hidden overlay) */
  #canvasOverlay {
    display: none; position: fixed; inset: 0;
    background: #fff; z-index: 900; flex-direction: column;
  }
  #canvasOverlay.show { display: flex; }
  #canvasOverlay .canvas-top {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 24px; border-bottom: 1px solid #dadce0;
  }
  #canvasOverlay .canvas-body { flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 12px; }
  #canvasOverlay textarea {
    padding: 12px; border: 1px solid #dadce0; border-radius: 12px;
    min-height: 80px; font-family: inherit; font-size: 14px; outline: none;
  }
  #canvasOverlay iframe {
    flex: 1; border: 1px solid #dadce0; border-radius: 12px; background: #fff;
  }
  .primary-btn { background: #1a73e8; color: #fff; padding: 10px 20px; border-radius: 12px; font-size: 13px; font-weight: 500; }
  .primary-btn:hover { background: #1557b0; }
  .ghost-btn { background: #fff; border: 1px solid #dadce0; padding: 10px 20px; border-radius: 12px; font-size: 13px; }

  /* Settings modal */
  #settingsModal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.4); z-index: 1000;
    align-items: center; justify-content: center;
  }
  #settingsModal.show { display: flex; }
  .modal-box { background: #fff; border-radius: 16px; padding: 24px; width: 400px; max-width: 90%; }
  .modal-box h3 { font-size: 15px; font-weight: 700; margin-bottom: 16px; }
  .modal-box label { font-size: 12px; font-weight: 600; display: block; margin-bottom: 4px; }
  .modal-box input {
    width: 100%; padding: 10px 12px; border: 1px solid #dadce0;
    border-radius: 12px; font-size: 13px; outline: none; margin-bottom: 16px;
  }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

  /* Sidebar toggle on mobile */
  @media (max-width: 768px) {
    #sidebar { position: absolute; z-index: 100; transform: translateX(-100%); transition: transform .3s; }
    #sidebar.open { transform: translateX(0); }
  }
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside id="sidebar">
  <div class="top">
    <div class="brand">
      <button id="sidebarToggle" style="width: 32px; height: 32px; border-radius: 50%; font-size: 15px; color: #5f6368;">
        <i class="fa-solid fa-bars"></i>
      </button>
      <svg class="brand-icon" viewBox="0 0 24 24">
        <path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z" fill="url(#starGrad)"/>
        <defs><linearGradient id="starGrad" x1="0" y1="0" x2="24" y2="24">
          <stop offset="0%" stop-color="#FF512F"/>
          <stop offset="50%" stop-color="#DD2476"/>
          <stop offset="100%" stop-color="#8A2387"/>
        </linearGradient></defs>
      </svg>
      <span class="brand-name">Loona</span>
    </div>

    <button id="newChatBtn" class="new-chat-btn">
      <i class="fa-solid fa-plus"></i> New chat
    </button>

    <button class="nav-btn"><i class="fa-solid fa-magnifying-glass"></i> Search chats</button>
    <button class="nav-btn"><i class="fa-solid fa-image"></i> Images & Studio</button>
    <button class="nav-btn"><i class="fa-solid fa-code"></i> Code & Scripts</button>
  </div>

  <div class="user-profile">
    <div class="user-info">
      <div class="avatar"><i class="fa-solid fa-user"></i></div>
      <div>
        <div class="user-name">Aurang Zeb</div>
        <div class="user-role">Creator</div>
      </div>
    </div>
    <button id="openSettings" class="icon-btn" style="width: 32px; height: 32px;">
      <i class="fa-solid fa-gear"></i>
    </button>
  </div>
</aside>

<!-- MAIN -->
<main>
  <div class="top-bar">
    <button id="newChatTop" class="icon-btn" title="New chat">
      <i class="fa-solid fa-pen-to-square"></i>
    </button>
  </div>

  <div class="chat-area">
    <div id="chatScroll" class="chat-scroll">
      <div id="welcome" class="welcome">
        <h1>What's next, Aurang?</h1>
      </div>
    </div>
  </div>

  <div class="input-wrapper">

    <!-- PLUS MENU -->
    <div id="plusMenu" class="plus-menu">
      <button id="btnUpload" class="menu-item">
        <i class="fa-solid fa-arrow-up-from-bracket m-icon ic-blue"></i>
        <span>Upload files</span>
      </button>

      <button id="btnDrive" class="menu-item">
        <i class="fa-brands fa-google-drive m-icon ic-green"></i>
        <span>Add from Drive</span>
      </button>

      <div class="has-sub">
        <button class="menu-item" style="justify-content: space-between;">
          <span style="display: flex; align-items: center; gap: 14px;">
            <i class="fa-solid fa-ellipsis m-icon ic-gray"></i>
            <span>More uploads</span>
          </span>
          <i class="fa-solid fa-chevron-right" style="font-size: 11px; color: #5f6368;"></i>
        </button>
        <div class="sub-menu">
          <button class="menu-item alert-btn" data-msg="Google Photos connected"><i class="fa-solid fa-images m-icon ic-blue"></i> Google Photos</button>
          <button class="menu-item alert-btn" data-msg="Avatar loaded"><i class="fa-solid fa-user-circle m-icon ic-purple"></i> Avatar</button>
          <button class="menu-item alert-btn" data-msg="Import code tool"><i class="fa-solid fa-file-import m-icon ic-yellow"></i> Import code</button>
          <button class="menu-item alert-btn" data-msg="Notebooks loaded"><i class="fa-solid fa-book m-icon ic-gray"></i> Notebooks</button>
        </div>
      </div>

      <hr class="menu-divider">

      <button id="btnImage" class="menu-item">
        <i class="fa-solid fa-image m-icon ic-blue"></i>
        <span>Create image</span>
      </button>

      <button class="menu-item alert-btn" data-msg="Video creation tool active!">
        <i class="fa-solid fa-clapperboard m-icon ic-red"></i>
        <span>Create video</span>
      </button>

      <button class="menu-item alert-btn" data-msg="Music studio active!">
        <i class="fa-solid fa-music m-icon ic-cyan"></i>
        <span>Create music</span>
      </button>

      <button id="btnCanvas" class="menu-item">
        <i class="fa-solid fa-palette m-icon ic-purple"></i>
        <span>Canvas</span>
      </button>

      <div class="has-sub">
        <button class="menu-item" style="justify-content: space-between;">
          <span style="display: flex; align-items: center; gap: 14px;">
            <i class="fa-solid fa-ellipsis m-icon ic-gray"></i>
            <span>More tools</span>
          </span>
          <i class="fa-solid fa-chevron-right" style="font-size: 11px; color: #5f6368;"></i>
        </button>
        <div class="sub-menu">
          <button class="menu-item alert-btn" data-msg="Guided Learning enabled">
            <i class="fa-regular fa-comment-dots m-icon ic-gray"></i> Guided Learning
          </button>
          <div class="lab-row" id="labRow">
            <span style="display: flex; align-items: center; gap: 12px;">
              <i class="fa-solid fa-wand-magic-sparkles m-icon ic-blue"></i>
              Personal Intelligence Labs
            </span>
            <label class="switch">
              <input type="checkbox" id="labToggle" checked>
              <span class="slider"></span>
            </label>
          </div>
        </div>
      </div>
    </div>

    <input type="file" id="fileInput" style="display: none;" multiple>

    <!-- INPUT BAR -->
    <div class="input-bar">
      <button id="plusBtn" class="plus">
        <i class="fa-solid fa-plus"></i>
      </button>
      <input id="chatInput" placeholder="Ask Loona" autocomplete="off">
      <button id="modelBtn" class="model-btn">
        <span id="modelName">Flash-Lite</span>
        <i class="fa-solid fa-chevron-down" style="font-size: 10px;"></i>
      </button>
      <button id="voiceBtn" class="mic">
        <i class="fa-solid fa-microphone"></i>
      </button>
      <button id="sendBtn" class="send">
        <i class="fa-solid fa-arrow-up"></i>
      </button>
    </div>
  </div>
</main>

<!-- CANVAS OVERLAY (Website/Code generator) -->
<div id="canvasOverlay">
  <div class="canvas-top">
    <h3 style="font-size: 15px; font-weight: 600;">Canvas</h3>
    <button id="closeCanvas" class="icon-btn">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>
  <div class="canvas-body">
    <textarea id="canvasPrompt" placeholder="Describe the website or code you want..."></textarea>
    <div style="display: flex; gap: 10px;">
      <button id="generateCanvas" class="primary-btn">Generate</button>
      <button id="downloadCanvas" class="ghost-btn">Download HTML</button>
    </div>
    <iframe id="canvasFrame" sandbox="allow-scripts"></iframe>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div id="settingsModal">
  <div class="modal-box">
    <h3>Settings</h3>
    <label>Gemini API Key (optional)</label>
    <input id="apiKey" type="password" placeholder="AIzaSy...">
    <div class="modal-actions">
      <button id="closeSettings" class="ghost-btn">Cancel</button>
      <button id="saveSettings" class="primary-btn">Save</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  function $(id) { return document.getElementById(id); }

  var userApiKey = localStorage.getItem('loona_api_key') || '';
  if (userApiKey) $("apiKey").value = userApiKey;

  /* ---------- PLUS MENU ---------- */
  $("plusBtn").addEventListener("click", function (e) {
    e.stopPropagation();
    $("plusMenu").classList.toggle("show");
  });

  document.addEventListener("click", function (e) {
    if (!e.target.closest("#plusMenu") && e.target !== $("plusBtn")) {
      $("plusMenu").classList.remove("show");
    }
  });

  /* ---------- UPLOAD FILES ---------- */
  $("btnUpload").addEventListener("click", function (e) {
    e.stopPropagation();
    $("fileInput").click();
  });
  $("fileInput").addEventListener("change", function () {
    if (this.files.length > 0) {
      var names = [];
      for (var i = 0; i < this.files.length; i++) names.push(this.files[i].name);
      $("chatInput").value = "[Attached: " + names.join(", ") + "] " + $("chatInput").value;
    }
    $("plusMenu").classList.remove("show");
  });

  /* ---------- ADD FROM DRIVE ---------- */
  $("btnDrive").addEventListener("click", function (e) {
    e.stopPropagation();
    alert("Google Drive integration connected!\n\n(Simulated — aap yahan apni Drive files browse kar sakte hain)");
    $("plusMenu").classList.remove("show");
  });

  /* ---------- ALERT BUTTONS ---------- */
  document.querySelectorAll(".alert-btn").forEach(function (btn) {
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      alert(this.getAttribute("data-msg"));
    });
  });

  /* ---------- CREATE IMAGE ---------- */
  $("btnImage").addEventListener("click", function (e) {
    e.stopPropagation();
    $("plusMenu").classList.remove("show");
    var p = prompt("Image description likhein:");
    if (!p) return;
    var welcome = $("welcome");
    if (welcome) welcome.remove();
    var botDiv = document.createElement("div");
    botDiv.className = "msg-bot";
    botDiv.innerHTML = 'Generating image...<br><img src="https://image.pollinations.ai/prompt/' + encodeURIComponent(p) + '?nologo=true&seed=' + Date.now() + '" style="max-width: 400px; border-radius: 12px; margin-top: 10px;">';
    $("chatScroll").appendChild(botDiv);
    $("chatScroll").scrollTop = $("chatScroll").scrollHeight;
  });

  /* ---------- CANVAS ---------- */
  $("btnCanvas").addEventListener("click", function (e) {
    e.stopPropagation();
    $("plusMenu").classList.remove("show");
    $("canvasOverlay").classList.add("show");
  });
  $("closeCanvas").addEventListener("click", function () {
    $("canvasOverlay").classList.remove("show");
  });
  $("generateCanvas").addEventListener("click", function () {
    var p = $("canvasPrompt").value.trim();
    if (!p) { alert("Prompt likhein"); return; }
    $("generateCanvas").textContent = "Ban rahi...";
    fetch("https://text.pollinations.ai/openai", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "openai",
        messages: [
          { role: "system", content: "Output ONLY a complete HTML file. No markdown, no explanation." },
          { role: "user", content: "Build a website: " + p }
        ]
      })
    })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var html = d.choices[0].message.content.replace(/^```[a-z]*\s*/i, "").replace(/```\s*$/, "").trim();
      $("canvasFrame").srcdoc = html;
      window._lastHTML = html;
      $("generateCanvas").textContent = "Generate";
    })
    .catch(function () { $("generateCanvas").textContent = "Generate"; alert("Error"); });
  });
  $("downloadCanvas").addEventListener("click", function () {
    if (!window._lastHTML) { alert("Pehle generate karein."); return; }
    var blob = new Blob([window._lastHTML], { type: "text/html" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'index.html'; a.click();
  });

  /* ---------- LAB TOGGLE ---------- */
  $("labRow").addEventListener("click", function (e) {
    e.stopPropagation();
    var t = $("labToggle");
    t.checked = !t.checked;
  });
  $("labToggle").addEventListener("click", function (e) { e.stopPropagation(); });

  /* ---------- SIDEBAR ---------- */
  $("sidebarToggle").addEventListener("click", function () {
    $("sidebar").classList.toggle("open");
  });

  /* ---------- NEW CHAT ---------- */
  function newChat() {
    $("chatScroll").innerHTML = '<div id="welcome" class="welcome"><h1>What\'s next, Aurang?</h1></div>';
  }
  $("newChatBtn").addEventListener("click", newChat);
  $("newChatTop").addEventListener("click", newChat);

  /* ---------- SETTINGS ---------- */
  $("openSettings").addEventListener("click", function () { $("settingsModal").classList.add("show"); });
  $("closeSettings").addEventListener("click", function () { $("settingsModal").classList.remove("show"); });
  $("saveSettings").addEventListener("click", function () {
    userApiKey = $("apiKey").value.trim();
    localStorage.setItem('loona_api_key', userApiKey);
    $("settingsModal").classList.remove("show");
    alert("Saved!");
  });

  /* ---------- SEND MESSAGE ---------- */
  $("sendBtn").addEventListener("click", function () {
    var text = $("chatInput").value.trim();
    if (!text) return;
    $("chatInput").value = "";

    var welcome = $("welcome");
    if (welcome) welcome.remove();

    var userDiv = document.createElement("div");
    userDiv.className = "msg-user";
    userDiv.textContent = text;
    $("chatScroll").appendChild(userDiv);

    var botDiv = document.createElement("div");
    botDiv.className = "msg-bot";
    botDiv.textContent = "Soch raha hoon...";
    $("chatScroll").appendChild(botDiv);
    $("chatScroll").scrollTop = $("chatScroll").scrollHeight;

    fetch("https://text.pollinations.ai/openai", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "openai",
        messages: [
          { role: "system", content: "You are Loona AI, a helpful assistant." },
          { role: "user", content: text }
        ]
      })
    })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      botDiv.textContent = d.choices[0].message.content;
      $("chatScroll").scrollTop = $("chatScroll").scrollHeight;
    })
    .catch(function () { botDiv.textContent = "Network error. Dobara try karein."; });
  });

  $("chatInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); $("sendBtn").click(); }
  });

  /* ---------- VOICE ---------- */
  $("voiceBtn").addEventListener("click", function () {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert("Voice input Chrome mein chalega."); return; }
    var rec = new SR();
    rec.lang = "ur-PK";
    rec.onresult = function (e) { $("chatInput").value = e.results[0][0].transcript; };
    rec.start();
  });

  /* ---------- MODEL PILL ---------- */
  $("modelBtn").addEventListener("click", function () {
    var models = ["Flash-Lite", "3.5 Flash", "3.1 Pro", "Extended Thinking"];
    var current = $("modelName").textContent;
    var idx = models.indexOf(current);
    $("modelName").textContent = models[(idx + 1) % models.length];
  });

  console.log("✅ Loona AI ready — click the + button.");
})();
</script>
</body>
</html>
