<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loona</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Google Sans', 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(180deg, #f8fafd 0%, #eef4fd 100%);
    color: #1f1f1f;
    display: flex;
    overflow: hidden;
  }
  button { cursor: pointer; font-family: inherit; border: none; background: transparent; }

  /* ============ SIDEBAR ============ */
  #sidebar {
    width: 260px;
    background: #f0f4f9;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    flex-shrink: 0;
    height: 100vh;
  }
  #sidebar .top { padding: 12px; }
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 6px; margin-bottom: 8px;
  }
  .brand-icon { width: 26px; height: 26px; }
  .brand-name { font-weight: 500; font-size: 18px; color: #1f1f1f; }

  .sidebar-pill {
    display: flex; background: #e4e8ed;
    padding: 3px; border-radius: 999px; margin: 8px 4px;
  }
  .sidebar-pill button {
    flex: 1; padding: 6px; border-radius: 999px;
    font-size: 13px; color: #5f6368; font-weight: 500;
  }
  .sidebar-pill button.active {
    background: #ffffff; color: #1a73e8;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }

  .new-chat-btn {
    display: flex; align-items: center; gap: 10px;
    background: #e8f0fe; color: #1967d2;
    padding: 10px 20px 10px 16px; border-radius: 999px;
    font-size: 14px; margin: 12px 6px; font-weight: 500;
  }
  .new-chat-btn:hover { background: #d2e3fc; }

  .nav-btn {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; border-radius: 999px;
    font-size: 13px; color: #1f1f1f; width: 100%; text-align: left;
    font-weight: 500;
  }
  .nav-btn:hover { background: #e4e8ed; }
  .nav-btn i { width: 18px; color: #5f6368; font-size: 14px; text-align: center; }

  .user-profile {
    padding: 10px 12px; border-top: 1px solid #dadce0;
    display: flex; align-items: center; justify-content: space-between;
  }
  .user-info { display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(135deg, #4285f4, #1a73e8);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 13px;
  }
  .user-name { font-size: 13px; font-weight: 600; }
  .user-role { font-size: 11px; color: #5f6368; }

  /* ============ MAIN ============ */
  main {
    flex: 1; display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }

  .top-bar {
    height: 56px; display: flex; align-items: center;
    justify-content: flex-end; padding: 0 24px; flex-shrink: 0;
  }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #5f6368; font-size: 15px;
  }
  .icon-btn:hover { background: #f1f3f4; }

  /* ============ CENTER STAGE ============ */
  .center-stage {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 0 20px 40px;
    overflow: hidden;
  }

  #chatScroll {
    width: 100%; max-width: 800px;
    max-height: 40vh; overflow-y: auto;
    display: flex; flex-direction: column; gap: 18px;
    padding: 0 8px; margin-bottom: 30px;
  }
  #chatScroll:empty { display: none; }

  .welcome h1 {
    font-size: 52px;
    font-weight: 400;
    color: #1f1f1f;
    letter-spacing: -1px;
    text-align: center;
    margin-bottom: 40px;
    background: linear-gradient(90deg, #1a73e8 0%, #4285f4 40%, #9b72cb 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .msg-user {
    align-self: flex-end; background: #d2e3fc;
    padding: 12px 18px; border-radius: 20px;
    max-width: 500px; font-size: 15px; word-wrap: break-word;
    color: #1f1f1f;
  }
  .msg-bot {
    padding: 6px 0; font-size: 15px;
    line-height: 1.6; white-space: pre-wrap; color: #1f1f1f;
  }

  /* ============ INPUT BAR ============ */
  .input-wrapper {
    width: 100%; max-width: 800px; position: relative;
  }
  .input-bar {
    background: #ffffff;
    border-radius: 999px;
    padding: 12px 22px;
    display: flex; align-items: center; gap: 12px;
    min-height: 56px;
    box-shadow: 0 1px 3px rgba(60,64,67,.08), 0 4px 12px rgba(26,115,232,.08);
    border: 1px solid #e0e7f0;
    transition: box-shadow .2s, border-color .2s;
  }
  .input-bar:hover {
    box-shadow: 0 1px 3px rgba(60,64,67,.1), 0 6px 16px rgba(26,115,232,.14);
  }
  .input-bar:focus-within {
    border-color: #1a73e8;
    box-shadow: 0 1px 3px rgba(60,64,67,.1), 0 6px 20px rgba(26,115,232,.22);
  }
  .input-bar .plus {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #1a73e8; font-size: 18px; flex-shrink: 0;
    transition: background .15s;
  }
  .input-bar .plus:hover { background: #e8f0fe; }
  .input-bar input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 15px; color: #1f1f1f; font-family: inherit;
    padding: 4px 0;
  }
  .input-bar input::placeholder { color: #5f6368; }

  /* Model pill */
  .model-wrapper { position: relative; }
  .input-bar .model-btn {
    display: flex; align-items: center; gap: 5px;
    font-size: 13px; color: #1a73e8; padding: 6px 12px;
    border-radius: 999px; font-weight: 500;
    background: #e8f0fe;
  }
  .input-bar .model-btn:hover { background: #d2e3fc; }

  .model-menu {
    display: none; position: absolute;
    bottom: calc(100% + 10px); right: 0;
    background: #fff; border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.18), 0 2px 6px rgba(0,0,0,.08);
    width: 260px; padding: 8px; z-index: 700;
    border: 1px solid #e0e7f0;
  }
  .model-menu.show { display: block; }

  .model-menu-title {
    font-size: 11px; font-weight: 600;
    color: #5f6368; text-transform: uppercase;
    letter-spacing: .5px; padding: 8px 12px 4px;
  }
  .model-option {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 14px; border-radius: 12px;
    font-size: 14px; color: #1f1f1f;
    width: 100%; text-align: left;
    transition: background .12s;
  }
  .model-option:hover { background: #f1f3f4; }
  .model-option.selected {
    background: #e8f0fe; color: #1a73e8; font-weight: 500;
  }
  .model-option .check {
    color: #1a73e8; font-size: 14px;
    visibility: hidden;
  }
  .model-option.selected .check { visibility: visible; }
  .model-option i:first-child {
    width: 20px; text-align: center; margin-right: 10px;
  }
  .model-option .label {
    display: flex; align-items: center; flex: 1;
  }

  .input-bar .mic, .input-bar .send {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #5f6368; font-size: 15px; transition: background .15s;
  }
  .input-bar .mic:hover { background: #e8f0fe; color: #1a73e8; }
  .input-bar .send {
    background: #1a73e8; color: #ffffff;
    width: 38px; height: 38px; font-size: 14px;
  }
  .input-bar .send:hover { background: #1557b0; }

  /* ============ PLUS MENU ============ */
  .plus-menu {
    display: none; position: absolute;
    bottom: 76px; left: 0;
    background: #fff; border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,.15), 0 2px 6px rgba(0,0,0,.06);
    width: 300px; padding: 10px; z-index: 500;
    border: 1px solid #e0e7f0;
  }
  .plus-menu.show { display: block; }

  .menu-item {
    display: flex; align-items: center; gap: 14px;
    padding: 11px 14px; border-radius: 12px;
    font-size: 14px; color: #1f1f1f; width: 100%;
    text-align: left; transition: background .12s;
    font-weight: 400;
  }
  .menu-item:hover { background: #f1f3f4; }
  .menu-item .m-icon {
    font-size: 17px; width: 22px; text-align: center; flex-shrink: 0;
  }
  .menu-divider { border: none; border-top: 1px solid #e8eaed; margin: 6px 4px; }

  /* Submenu */
  .has-sub { position: relative; }
  .sub-menu {
    display: none; position: absolute;
    left: calc(100% + 6px); top: -8px;
    background: #fff; border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.15);
    width: 260px; padding: 10px; z-index: 600;
    border: 1px solid #e0e7f0;
  }
  .has-sub:hover .sub-menu { display: block; }
  .sub-menu .menu-item { font-size: 13.5px; }

  /* Toggle */
  .lab-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; border-radius: 12px;
    font-size: 13.5px; cursor: pointer;
  }
  .lab-row:hover { background: #f1f3f4; }
  .switch { position: relative; display: inline-block; width: 34px; height: 20px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #dadce0; border-radius: 20px; transition: .2s; }
  .slider::before {
    content: ""; position: absolute;
    height: 14px; width: 14px; left: 3px; bottom: 3px;
    background: #fff; border-radius: 50%; transition: .2s;
  }
  .switch input:checked + .slider { background: #1a73e8; }
  .switch input:checked + .slider::before { transform: translateX(14px); }

  /* Icons */
  .ic-blue { color: #1a73e8; }
  .ic-green { color: #34a853; }
  .ic-gray { color: #5f6368; }
  .ic-red { color: #ea4335; }
  .ic-yellow { color: #fbbc04; }
  .ic-purple { color: #a142f4; }
  .ic-cyan { color: #00acc1; }

  /* ============ CANVAS OVERLAY ============ */
  #canvasOverlay {
    display: none; position: fixed; inset: 0;
    background: #fff; z-index: 900; flex-direction: column;
  }
  #canvasOverlay.show { display: flex; }
  #canvasOverlay .canvas-top {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 24px; border-bottom: 1px solid #dadce0;
  }
  #canvasOverlay .canvas-body {
    flex: 1; display: flex; flex-direction: column;
    padding: 20px; gap: 12px;
  }
  #canvasOverlay textarea {
    padding: 12px; border: 1px solid #dadce0; border-radius: 12px;
    min-height: 80px; font-family: inherit; font-size: 14px;
    outline: none; resize: vertical;
  }
  #canvasOverlay iframe {
    flex: 1; border: 1px solid #dadce0; border-radius: 12px; background: #fff;
  }
  .primary-btn {
    background: #1a73e8; color: #fff;
    padding: 10px 20px; border-radius: 999px;
    font-size: 13px; font-weight: 500;
  }
  .primary-btn:hover { background: #1557b0; }
  .ghost-btn {
    background: #fff; border: 1px solid #dadce0;
    padding: 10px 20px; border-radius: 999px; font-size: 13px;
  }
  .ghost-btn:hover { background: #f1f3f4; }

  /* ============ SETTINGS MODAL ============ */
  #settingsModal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.4); z-index: 1000;
    align-items: center; justify-content: center;
  }
  #settingsModal.show { display: flex; }
  .modal-box {
    background: #fff; border-radius: 20px;
    padding: 26px; width: 420px; max-width: 92%;
  }
  .modal-box h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
  .modal-box label {
    font-size: 12px; font-weight: 600;
    display: block; margin-bottom: 6px; color: #1f1f1f;
  }
  .modal-box input {
    width: 100%; padding: 12px 14px;
    border: 1px solid #dadce0; border-radius: 12px;
    font-size: 13px; outline: none; margin-bottom: 18px;
    font-family: inherit;
  }
  .modal-box input:focus { border-color: #1a73e8; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

  @media (max-width: 768px) {
    #sidebar {
      position: absolute; z-index: 100;
      transform: translateX(-100%); transition: transform .3s;
    }
    #sidebar.open { transform: translateX(0); }
    .welcome h1 { font-size: 32px; }
  }
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside id="sidebar">
  <div class="top">
    <div class="brand">
      <button id="sidebarToggle" style="width: 36px; height: 36px; border-radius: 50%; font-size: 15px; color: #5f6368;">
        <i class="fa-solid fa-bars"></i>
      </button>
      <svg class="brand-icon" viewBox="0 0 24 24">
        <path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z" fill="url(#starGrad)"/>
        <defs><linearGradient id="starGrad" x1="0" y1="0" x2="24" y2="24">
          <stop offset="0%" stop-color="#FF512F"/>
          <stop offset="50%" stop-color="#DD2476"/>
          <stop offset="100%" stop-color="#8A2387"/>
        </linearGradient></defs>
      </svg>
      <span class="brand-name">Loona</span>
    </div>

    <div class="sidebar-pill">
      <button class="active">Chat</button>
      <button>Spark <span style="font-size: 9px; background: #e4e8ed; padding: 1px 5px; border-radius: 6px; margin-left: 4px;">BETA</span></button>
    </div>

    <button id="newChatBtn" class="new-chat-btn">
      <i class="fa-solid fa-plus"></i> New chat
    </button>

    <button class="nav-btn"><i class="fa-solid fa-magnifying-glass"></i> Search chats</button>
    <button class="nav-btn"><i class="fa-solid fa-graduation-cap"></i> Students</button>
    <button class="nav-btn"><i class="fa-solid fa-image"></i> Images</button>
    <button class="nav-btn"><i class="fa-solid fa-video"></i> Videos</button>
    <button class="nav-btn"><i class="fa-solid fa-book-open"></i> Library</button>
  </div>

  <div class="user-profile">
    <div class="user-info">
      <div class="avatar"><i class="fa-solid fa-user"></i></div>
      <div>
        <div class="user-name">Aurang Zeb</div>
        <div class="user-role">Creator</div>
      </div>
    </div>
    <button id="openSettings" class="icon-btn" style="width: 32px; height: 32px;">
      <i class="fa-solid fa-gear"></i>
    </button>
  </div>
</aside>

<!-- MAIN -->
<main>
  <div class="top-bar">
    <button id="newChatTop" class="icon-btn" title="New chat">
      <i class="fa-solid fa-pen-to-square"></i>
    </button>
  </div>

  <!-- CENTER STAGE -->
  <div class="center-stage">

    <div id="chatScroll"></div>

    <div id="welcome" class="welcome">
      <h1>What's next, Aurang?</h1>
    </div>

    <div class="input-wrapper">

      <!-- PLUS MENU -->
      <div id="plusMenu" class="plus-menu">
        <button id="btnUpload" class="menu-item">
          <i class="fa-solid fa-arrow-up-from-bracket m-icon ic-blue"></i>
          <span>Upload files</span>
        </button>
        <button id="btnDrive" class="menu-item">
          <i class="fa-brands fa-google-drive m-icon ic-green"></i>
          <span>Add from Drive</span>
        </button>
        <div class="has-sub">
          <button class="menu-item" style="justify-content: space-between;">
            <span style="display: flex; align-items: center; gap: 14px;">
              <i class="fa-solid fa-ellipsis m-icon ic-gray"></i>
              <span>More uploads</span>
            </span>
            <i class="fa-solid fa-chevron-right" style="font-size: 11px; color: #5f6368;"></i>
          </button>
          <div class="sub-menu">
            <button class="menu-item alert-btn" data-msg="Google Photos connected">
              <i class="fa-solid fa-images m-icon ic-blue"></i> Google Photos
            </button>
            <button class="menu-item alert-btn" data-msg="Avatar loaded">
              <i class="fa-solid fa-user-circle m-icon ic-purple"></i> Avatar
            </button>
            <button class="menu-item alert-btn" data-msg="Import code tool">
              <i class="fa-solid fa-file-import m-icon ic-yellow"></i> Import code
            </button>
            <button class="menu-item alert-btn" data-msg="Notebooks loaded">
              <i class="fa-solid fa-book m-icon ic-gray"></i> Notebooks
            </button>
          </div>
        </div>
        <hr class="menu-divider">
        <button id="btnImage" class="menu-item">
          <i class="fa-solid fa-image m-icon ic-blue"></i>
          <span>Create image</span>
        </button>
        <button class="menu-item alert-btn" data-msg="Video creation tool active!">
          <i class="fa-solid fa-clapperboard m-icon ic-red"></i>
          <span>Create video</span>
        </button>
        <button class="menu-item alert-btn" data-msg="Music studio active!">
          <i class="fa-solid fa-music m-icon ic-cyan"></i>
          <span>Create music</span>
        </button>
        <button id="btnCanvas" class="menu-item">
          <i class="fa-solid fa-palette m-icon ic-purple"></i>
          <span>Canvas</span>
        </button>
        <div class="has-sub">
          <button class="menu-item" style="justify-content: space-between;">
            <span style="display: flex; align-items: center; gap: 14px;">
              <i class="fa-solid fa-ellipsis m-icon ic-gray"></i>
              <span>More tools</span>
            </span>
            <i class="fa-solid fa-chevron-right" style="font-size: 11px; color: #5f6368;"></i>
          </button>
          <div class="sub-menu">
            <button class="menu-item alert-btn" data-msg="Guided Learning enabled">
              <i class="fa-regular fa-comment-dots m-icon ic-gray"></i> Guided Learning
            </button>
            <div class="lab-row" id="labRow">
              <span style="display: flex; align-items: center; gap: 12px;">
                <i class="fa-solid fa-wand-magic-sparkles m-icon ic-blue"></i>
                Personal Intelligence Labs
              </span>
              <label class="switch">
                <input type="checkbox" id="labToggle" checked>
                <span class="slider"></span>
              </label>
            </div>
          </div>
        </div>
      </div>

      <input type="file" id="fileInput" style="display: none;" multiple>

      <!-- INPUT BAR -->
      <div class="input-bar">
        <button id="plusBtn" class="plus" title="Add files or tools">
          <i class="fa-solid fa-plus"></i>
        </button>
        <input id="chatInput" placeholder="Ask Loona" autocomplete="off">

        <!-- MODEL PILL + MENU -->
        <div class="model-wrapper">
          <button id="modelBtn" class="model-btn">
            <span id="modelName">Flash-Lite</span>
            <i class="fa-solid fa-chevron-down" style="font-size: 10px;"></i>
          </button>

          <div id="modelMenu" class="model-menu">
            <div class="model-menu-title">Choose a model</div>

            <button class="model-option selected" data-model="Flash-Lite">
              <span class="label">
                <i class="fa-solid fa-bolt ic-yellow"></i>
                Flash-Lite
              </span>
              <i class="fa-solid fa-check check"></i>
            </button>

            <button class="model-option" data-model="3.5 Flash">
              <span class="label">
                <i class="fa-solid fa-bolt ic-blue"></i>
                3.5 Flash
              </span>
              <i class="fa-solid fa-check check"></i>
            </button>

            <button class="model-option" data-model="3.1 Pro">
              <span class="label">
                <i class="fa-solid fa-star ic-purple"></i>
                3.1 Pro
              </span>
              <i class="fa-solid fa-check check"></i>
            </button>

            <button class="model-option" data-model="Extended Thinking">
              <span class="label">
                <i class="fa-solid fa-brain ic-blue"></i>
                Extended Thinking
              </span>
              <i class="fa-solid fa-check check"></i>
            </button>

            <hr class="menu-divider">

            <button class="model-option" data-model="Deep Research">
              <span class="label">
                <i class="fa-solid fa-magnifying-glass ic-green"></i>
                Deep Research
              </span>
              <i class="fa-solid fa-check check"></i>
            </button>
          </div>
        </div>

        <button id="voiceBtn" class="mic" title="Use microphone">
          <i class="fa-solid fa-microphone"></i>
        </button>
        <button id="sendBtn" class="send" title="Send">
          <i class="fa-solid fa-arrow-up"></i>
        </button>
      </div>
    </div>
  </div>
</main>

<!-- CANVAS OVERLAY -->
<div id="canvasOverlay">
  <div class="canvas-top">
    <h3 style="font-size: 15px; font-weight: 600;">Canvas</h3>
    <button id="closeCanvas" class="icon-btn">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>
  <div class="canvas-body">
    <textarea id="canvasPrompt" placeholder="Describe the website or code you want..."></textarea>
    <div style="display: flex; gap: 10px;">
      <button id="generateCanvas" class="primary-btn">Generate</button>
      <button id="downloadCanvas" class="ghost-btn">Download HTML</button>
    </div>
    <iframe id="canvasFrame" sandbox="allow-scripts"></iframe>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div id="settingsModal">
  <div class="modal-box">
    <h3>Settings</h3>
    <label>Gemini API Key (optional)</label>
    <input id="apiKey" type="password" placeholder="AIzaSy...">
    <div class="modal-actions">
      <button id="closeSettings" class="ghost-btn">Cancel</button>
      <button id="saveSettings" class="primary-btn">Save</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  function $(id) { return document.getElementById(id); }

  var userApiKey = localStorage.getItem('loona_api_key') || '';
  if (userApiKey) $("apiKey").value = userApiKey;

  /* ============ PLUS MENU ============ */
  $("plusBtn").addEventListener("click", function (e) {
    e.stopPropagation();
    $("plusMenu").classList.toggle("show");
    $("modelMenu").classList.remove("show");
  });
  document.addEventListener("click", function (e) {
    if (!e.target.closest("#plusMenu") && e.target !== $("plusBtn")) {
      $("plusMenu").classList.remove("show");
    }
    if (!e.target.closest("#modelMenu") && !e.target.closest("#modelBtn")) {
      $("modelMenu").classList.remove("show");
    }
  });

  /* ============ MODEL MENU ============ */
  $("modelBtn").addEventListener("click", function (e) {
    e.stopPropagation();
    $("modelMenu").classList.toggle("show");
    $("plusMenu").classList.remove("show");
  });

  document.querySelectorAll(".model-option").forEach(function (btn) {
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var name = this.getAttribute("data-model");
      $("modelName").textContent = name;
      document.querySelectorAll(".model-option").forEach(function (b) {
        b.classList.remove("selected");
      });
      this.classList.add("selected");
      $("modelMenu").classList.remove("show");
    });
  });

  /* ============ UPLOAD ============ */
  $("btnUpload").addEventListener("click", function (e) {
    e.stopPropagation();
    $("fileInput").click();
  });
  $("fileInput").addEventListener("change", function () {
    if (this.files.length > 0) {
      var names = [];
      for (var i = 0; i < this.files.length; i++) names.push(this.files[i].name);
      $("chatInput").value = "[Attached: " + names.join(", ") + "] " + $("chatInput").value;
    }
    $("plusMenu").classList.remove("show");
  });

  /* ============ DRIVE ============ */
  $("btnDrive").addEventListener("click", function (e) {
    e.stopPropagation();
    alert("Google Drive integration connected!\n\n(Aap yahan apni Drive files browse kar sakte hain)");
    $("plusMenu").classList.remove("show");
  });

  /* ============ ALERT BUTTONS ============ */
  document.querySelectorAll(".alert-btn").forEach(function (btn) {
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      alert(this.getAttribute("data-msg"));
    });
  });

  /* ============ CREATE IMAGE ============ */
  $("btnImage").addEventListener("click", function (e) {
    e.stopPropagation();
    $("plusMenu").classList.remove("show");
    var p = prompt("Image description likhein:");
    if (!p) return;
    removeWelcome();
    var botDiv = document.createElement("div");
    botDiv.className = "msg-bot";
    botDiv.innerHTML = 'Generating image...<br><img src="https://image.pollinations.ai/prompt/' + encodeURIComponent(p) + '?nologo=true&seed=' + Date.now() + '" style="max-width: 400px; border-radius: 12px; margin-top: 10px;">';
    $("chatScroll").appendChild(botDiv);
    $("chatScroll").scrollTop = $("chatScroll").scrollHeight;
  });

  /* ============ CANVAS ============ */
  $("btnCanvas").addEventListener("click", function (e) {
    e.stopPropagation();
    $("plusMenu").classList.remove("show");
    $("canvasOverlay").classList.add("show");
  });
  $("closeCanvas").addEventListener("click", function () {
    $("canvasOverlay").classList.remove("show");
  });
  $("generateCanvas").addEventListener("click", function () {
    var p = $("canvasPrompt").value.trim();
    if (!p) { alert("Prompt likhein"); return; }
    $("generateCanvas").textContent = "Ban rahi...";
    fetch("https://text.pollinations.ai/openai", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "openai",
        messages: [
          { role: "system", content: "Output ONLY a complete HTML file. No markdown, no explanation." },
          { role: "user", content: "Build a website: " + p }
        ]
      })
    })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var html = d.choices[0].message.content.replace(/^```[a-z]*\s*/i, "").replace(/```\s*$/, "").trim();
      $("canvasFrame").srcdoc = html;
      window._lastHTML = html;
      $("generateCanvas").textContent = "Generate";
    })
    .catch(function () { $("generateCanvas").textContent = "Generate"; alert("Error"); });
  });
  $("downloadCanvas").addEventListener("click", function () {
    if (!window._lastHTML) { alert("Pehle generate karein."); return; }
    var blob = new Blob([window._lastHTML], { type: "text/html" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'index.html'; a.click();
  });

  /* ============ LAB TOGGLE ============ */
  $("labRow").addEventListener("click", function (e) {
    e.stopPropagation();
    var t = $("labToggle");
    t.checked = !t.checked;
  });
  $("labToggle").addEventListener("click", function (e) { e.stopPropagation(); });
